<title>RED Team Dog Run</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500&display=swap">
<style>
  /* Layout: fullscreen WebGL walkthrough with a signage-style HUD; single committed dark look */
  :root{
    --ink:#ece7da;
    --ink-dim:#b9b3a4;
    --panel:rgba(14,14,12,0.68);
    --panel-strong:rgba(14,14,12,0.86);
    --line:rgba(236,231,218,0.22);
    --accent:#e2635f;
    --canvas-bg:#aecfe8;
    --display-font:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
    --body-font:"Barlow","Helvetica Neue",Arial,sans-serif;
    color-scheme:dark;
  }
  body{
    margin:0;
    background:var(--canvas-bg);
    color:var(--ink);
    font-family:var(--body-font);
    overflow:hidden;
    padding-left:max(16px, env(safe-area-inset-left, 0px));
    padding-right:max(16px, env(safe-area-inset-right, 0px));
  }
  #sceneCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
    cursor:grab;
  }
  #labelLayer{position:fixed; inset:0; overflow:hidden; pointer-events:none;}
  .siteLabel{
    position:absolute;
    transform:translate(-50%,-100%);
    background:var(--panel);
    border:1px solid var(--line);
    border-left:3px solid var(--accent);
    color:var(--ink);
    font-size:12px;
    line-height:1.2;
    padding:4px 9px 5px;
    border-radius:3px;
    white-space:nowrap;
    pointer-events:none;
  }
  #hudHeader{
    position:fixed;
    top:calc(10px + env(safe-area-inset-top, 0px));
    left:max(16px, env(safe-area-inset-left, 0px));
    max-width:min(76vw, 460px);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:4px;
    padding:10px 14px 11px;
    backdrop-filter:blur(8px);
  }
  #hudHeader .eyebrow{
    margin:0 0 2px;
    font-family:var(--display-font);
    font-weight:600;
    font-size:clamp(16px, 3.8vw, 23px);
    letter-spacing:0.05em;
    color:var(--accent);
    text-transform:uppercase;
  }
  #hudHeader h1{
    margin:0;
    font-family:var(--display-font);
    font-weight:600;
    font-size:clamp(16px, 3.8vw, 23px);
    line-height:1.05;
    letter-spacing:0.01em;
    text-wrap:balance;
  }
  #controlBar{
    position:fixed;
    bottom:calc(14px + env(safe-area-inset-bottom, 0px));
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:8px;
    align-items:center;
    flex-wrap:wrap;
    justify-content:center;
    max-width:calc(100vw - 32px);
  }
  .segmented{display:flex; gap:0; border:1px solid var(--line); border-radius:4px; overflow:hidden; background:var(--panel); backdrop-filter:blur(8px);}
  .segmented button{border:0; border-right:1px solid var(--line);}
  .segmented button:last-child{border-right:0;}
  #controlBar button{
    appearance:none;
    background:var(--panel);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:4px;
    font-family:var(--display-font);
    font-weight:600;
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding:9px 14px;
    cursor:pointer;
    backdrop-filter:blur(8px);
  }
  .segmented button{border-radius:0; background:transparent;}
  #controlBar button.active{color:#121210; background:var(--accent); border-color:var(--accent);}
  #controlBar button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  #hintOverlay{
    position:fixed;
    bottom:calc(72px + env(safe-area-inset-bottom, 0px));
    left:50%;
    transform:translateX(-50%);
    background:var(--panel-strong);
    border:1px solid var(--line);
    border-radius:4px;
    color:var(--ink);
    font-size:13px;
    padding:8px 14px;
    max-width:min(86vw, 480px);
    text-align:center;
    transition:opacity 0.6s;
  }
  @media (prefers-reduced-motion: reduce){ #hintOverlay{transition:none;} }
  #joystickBase{
    position:fixed;
    left:calc(26px + env(safe-area-inset-left, 0px));
    bottom:calc(86px + env(safe-area-inset-bottom, 0px));
    width:112px;
    height:112px;
    border-radius:50%;
    border:1px solid var(--line);
    background:rgba(14,14,12,0.4);
    touch-action:none;
  }
  #joystickNub{
    position:absolute;
    left:50%;
    top:50%;
    width:46px;
    height:46px;
    border-radius:50%;
    background:var(--panel-strong);
    border:1px solid var(--accent);
    transform:translate(-50%,-50%);
  }
  #jumpButton{
    position:fixed;
    right:calc(26px + env(safe-area-inset-right, 0px));
    bottom:calc(96px + env(safe-area-inset-bottom, 0px));
    width:74px;
    height:74px;
    border-radius:50%;
    background:var(--panel-strong);
    color:var(--ink);
    border:1px solid var(--accent);
    font-family:var(--display-font);
    font-weight:600;
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    touch-action:none;
  }
  #errorNote{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:var(--panel-strong);
    border:1px solid var(--line);
    border-radius:4px;
    padding:18px 22px;
    max-width:min(86vw, 420px);
    font-size:14px;
    line-height:1.5;
    text-align:center;
  }
  @media (max-width:520px){
    #controlBar button{padding:8px 10px; font-size:12px;}
  }
</style>

<canvas id="sceneCanvas"></canvas>
<div id="labelLayer"></div>

<header id="hudHeader">
  <p class="eyebrow">Red Team &middot; Collab: Urban Futures</p>
  <h1>E 60th St &amp; 1st Ave Dog Run</h1>
</header>

<div id="hintOverlay" hidden></div>

<nav id="controlBar" aria-label="Walkthrough controls">
  <div class="segmented" role="group" aria-label="View mode">
    <button id="walkButton" class="active">Walk</button>
    <button id="dogButton">Dog eye</button>
    <button id="orbitButton">Overview</button>
  </div>
  <button id="nightButton">Night</button>
  <button id="labelsButton" class="active">Labels</button>
</nav>

<div id="joystickBase" hidden><div id="joystickNub"></div></div>
<button id="jumpButton" hidden>Jump</button>
<div id="errorNote" hidden>The 3D scene could not start in this browser. Try a recent Chrome, Safari or Firefox with WebGL enabled.</div>

<script type="module">
import * as THREE from "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";

/* ---------- site constants: everything in meters, from the team's measured plan ---------- */
const SITE_WIDTH = 32.3;   // 106 ft, east-west
const SITE_DEPTH = 30.5;   // 100 ft, north-south
const PARK_GROUND_HEIGHT = 0.1;

function planToWorldX(planX){ return planX - SITE_WIDTH / 2; }
function planToWorldZ(planZ){ return SITE_DEPTH / 2 - planZ; }

const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const isTouchDevice = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;

/* ---------- renderer / scene ---------- */
const canvas = document.getElementById("sceneCanvas");
let renderer;
try{
  renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
}catch(creationError){
  document.getElementById("errorNote").hidden = false;
  throw creationError;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 400);
camera.rotation.order = "YXZ";

/* ---------- small canvas textures ---------- */
function createSpeckleTexture(baseColor, speckleColors, speckleCount, repeatX, repeatY){
  const textureCanvas = document.createElement("canvas");
  textureCanvas.width = 256; textureCanvas.height = 256;
  const context = textureCanvas.getContext("2d");
  context.fillStyle = baseColor;
  context.fillRect(0, 0, 256, 256);
  for(let index = 0; index < speckleCount; index++){
    context.fillStyle = speckleColors[index % speckleColors.length];
    context.globalAlpha = 0.35 + Math.random() * 0.4;
    const radius = 0.7 + Math.random() * 1.6;
    context.beginPath();
    context.arc(Math.random() * 256, Math.random() * 256, radius, 0, Math.PI * 2);
    context.fill();
  }
  context.globalAlpha = 1;
  const texture = new THREE.CanvasTexture(textureCanvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(repeatX, repeatY);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

function createWindowTexture(){
  const textureCanvas = document.createElement("canvas");
  textureCanvas.width = 128; textureCanvas.height = 256;
  const context = textureCanvas.getContext("2d");
  context.fillStyle = "#000000";
  context.fillRect(0, 0, 128, 256);
  const columns = 6, rows = 13;
  for(let column = 0; column < columns; column++){
    for(let row = 0; row < rows; row++){
      if(Math.random() < 0.55){
        context.fillStyle = Math.random() < 0.75 ? "#ffc98a" : "#cfe0ff";
        context.globalAlpha = 0.5 + Math.random() * 0.5;
        context.fillRect(8 + column * 20, 10 + row * 18, 11, 9);
      }
    }
  }
  context.globalAlpha = 1;
  const texture = new THREE.CanvasTexture(textureCanvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

const gravelTexture = createSpeckleTexture("#d6bf95", ["#c2ab80", "#e6d2ac", "#ab9671", "#bfa87d"], 900, 9, 9);
const windowTexture = createWindowTexture();

/* ---------- materials ---------- */
const gravelMaterial   = new THREE.MeshStandardMaterial({ map: gravelTexture, roughness: 1 });
const sidewalkMaterial = new THREE.MeshStandardMaterial({ color: "#a6a59d", roughness: 1 });
const asphaltMaterial  = new THREE.MeshStandardMaterial({ color: "#3d3e42", roughness: 1 });
const grassMaterial    = new THREE.MeshStandardMaterial({ color: "#6f9152", roughness: 1 });
const woodMaterial     = new THREE.MeshStandardMaterial({ color: "#a98052", roughness: 0.85 });
const woodDarkMaterial = new THREE.MeshStandardMaterial({ color: "#8a6840", roughness: 0.9 });
const fenceMaterial    = new THREE.MeshStandardMaterial({ color: "#26262b", roughness: 0.55, metalness: 0.4 });
const stoneMaterial    = new THREE.MeshStandardMaterial({ color: "#b3a996", roughness: 1 });
const stoneDarkMaterial= new THREE.MeshStandardMaterial({ color: "#2e2a25", roughness: 1 });
const moundMaterial    = new THREE.MeshStandardMaterial({ color: "#c7a87c", roughness: 1, flatShading: true });
const holeMaterial     = new THREE.MeshStandardMaterial({ color: "#241c14", roughness: 1 });
const pipeMaterial     = new THREE.MeshStandardMaterial({ color: "#d95f57", roughness: 0.5, metalness: 0.3 });
const steelMaterial    = new THREE.MeshStandardMaterial({ color: "#c6ccd2", roughness: 0.35, metalness: 0.6 });
const trunkMaterial    = new THREE.MeshStandardMaterial({ color: "#6e523a", roughness: 1 });
const waterMaterial    = new THREE.MeshStandardMaterial({ color: "#3e6fae", roughness: 0.25, metalness: 0.1 });
const plasticDarkMaterial = new THREE.MeshStandardMaterial({ color: "#2e2e31", roughness: 0.8 });
const rockMaterial     = new THREE.MeshStandardMaterial({ color: "#9a948a", roughness: 1, flatShading: true });
const leafMaterials = [
  new THREE.MeshStandardMaterial({ color: "#5f8f4f", roughness: 1, flatShading: true }),
  new THREE.MeshStandardMaterial({ color: "#6f9a52", roughness: 1, flatShading: true }),
  new THREE.MeshStandardMaterial({ color: "#86a85f", roughness: 1, flatShading: true })
];
const bushMaterial = new THREE.MeshStandardMaterial({ color: "#4f7040", roughness: 1, flatShading: true });
const stringLightMaterial = new THREE.MeshStandardMaterial({ color: "#5a4a32", emissive: "#ffcf8a", emissiveIntensity: 0 });
const bollardCapMaterial  = new THREE.MeshStandardMaterial({ color: "#3a372f", emissive: "#ffc98a", emissiveIntensity: 0 });
const lampFixtureMaterial = new THREE.MeshStandardMaterial({ color: "#d8d2c0", emissive: "#fff3d0", emissiveIntensity: 0 });
const deckSteelMaterial   = new THREE.MeshStandardMaterial({ color: "#4a4440", roughness: 0.9 });
const upperSteelMaterial  = new THREE.MeshStandardMaterial({ color: "#3a3733", roughness: 0.9 });
const tramMaterial        = new THREE.MeshStandardMaterial({ color: "#c03a2e", roughness: 0.5 });
const cableMaterial       = new THREE.MeshStandardMaterial({ color: "#44444a", roughness: 0.6 });
const crosswalkMaterial   = new THREE.MeshStandardMaterial({ color: "#cfcfc9", roughness: 1 });

const buildingWindowMaterials = [];
function createBuildingMaterial(facadeColor, buildingWidth, buildingHeight){
  const texture = windowTexture.clone();
  texture.needsUpdate = true;
  texture.repeat.set(Math.max(1, buildingWidth / 8), Math.max(1, buildingHeight / 10));
  const material = new THREE.MeshStandardMaterial({
    color: facadeColor, roughness: 1,
    emissive: new THREE.Color("#ffb46b"), emissiveMap: texture, emissiveIntensity: 0
  });
  buildingWindowMaterials.push(material);
  return material;
}

/* ---------- ground planes ---------- */
const asphaltPlane = new THREE.Mesh(new THREE.PlaneGeometry(280, 240), asphaltMaterial);
asphaltPlane.rotation.x = -Math.PI / 2;
asphaltPlane.receiveShadow = true;
scene.add(asphaltPlane);

const sidewalkSlab = new THREE.Mesh(new THREE.BoxGeometry(SITE_WIDTH + 8, 0.12, SITE_DEPTH + 8), sidewalkMaterial);
sidewalkSlab.position.y = 0.0;
sidewalkSlab.receiveShadow = true;
scene.add(sidewalkSlab);

const parkGroup = new THREE.Group();
parkGroup.position.y = PARK_GROUND_HEIGHT;
scene.add(parkGroup);

const gravelPad = new THREE.Mesh(new THREE.BoxGeometry(SITE_WIDTH, 0.12, SITE_DEPTH), gravelMaterial);
gravelPad.position.y = -0.06;
gravelPad.receiveShadow = true;
parkGroup.add(gravelPad);

function placeInPark(object, planX, planZ, heightY){
  object.position.set(planToWorldX(planX), heightY, planToWorldZ(planZ));
  parkGroup.add(object);
}
function placeInScene(object, planX, planZ, heightY){
  object.position.set(planToWorldX(planX), heightY, planToWorldZ(planZ));
  scene.add(object);
}

/* green strips (east strip 1.9 x 20.7 m, south strip 19 x 2.1 m, per plan) */
const eastStrip = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.16, 20.7), grassMaterial);
placeInPark(eastStrip, 31.2, 18.6, 0.06);
const southStrip = new THREE.Mesh(new THREE.BoxGeometry(19.0, 0.16, 1.6), grassMaterial);
placeInPark(southStrip, 14.8, 1.6, 0.06);

/* ---------- perimeter fence (black metal) with SE double-door entrance ---------- */
const fenceSegments = [
  { fromX: 0,    fromZ: 0,    toX: 27.6, toZ: 0 },
  { fromX: 30.2, fromZ: 0,    toX: 32.3, toZ: 0 },
  { fromX: 32.3, fromZ: 0,    toX: 32.3, toZ: 30.5 },
  { fromX: 0,    fromZ: 30.5, toX: 32.3, toZ: 30.5 },
  { fromX: 0,    fromZ: 0,    toX: 0,    toZ: 30.5 },
  { fromX: 27.6, fromZ: 0,    toX: 27.6, toZ: 4.3 },   // vestibule return
  { fromX: 30.2, fromZ: 0,    toX: 30.2, toZ: 4.3 }    // vestibule return
];
const FENCE_HEIGHT = 1.5;
const barGeometry = new THREE.CylinderGeometry(0.013, 0.013, 1.3, 5);
let totalBarCount = 0;
for(const segment of fenceSegments){
  totalBarCount += Math.floor(Math.hypot(segment.toX - segment.fromX, segment.toZ - segment.fromZ) / 0.14);
}
const fenceBars = new THREE.InstancedMesh(barGeometry, fenceMaterial, totalBarCount);
let barIndex = 0;
const barMatrix = new THREE.Matrix4();
for(const segment of fenceSegments){
  const segmentLength = Math.hypot(segment.toX - segment.fromX, segment.toZ - segment.fromZ);
  const directionX = (segment.toX - segment.fromX) / segmentLength;
  const directionZ = (segment.toZ - segment.fromZ) / segmentLength;
  /* rails */
  for(const railY of [1.42, 0.12]){
    const rail = new THREE.Mesh(new THREE.BoxGeometry(segmentLength, 0.05, 0.04), fenceMaterial);
    rail.position.set(
      planToWorldX((segment.fromX + segment.toX) / 2),
      railY,
      planToWorldZ((segment.fromZ + segment.toZ) / 2)
    );
    rail.rotation.y = Math.atan2(directionZ, directionX);
    parkGroup.add(rail);
  }
  /* posts */
  const postCount = Math.max(2, Math.round(segmentLength / 2.4) + 1);
  for(let postIndex = 0; postIndex < postCount; postIndex++){
    const alongDistance = (segmentLength * postIndex) / (postCount - 1);
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, FENCE_HEIGHT, 6), fenceMaterial);
    post.position.set(
      planToWorldX(segment.fromX + directionX * alongDistance),
      FENCE_HEIGHT / 2,
      planToWorldZ(segment.fromZ + directionZ * alongDistance)
    );
    post.castShadow = true;
    parkGroup.add(post);
  }
  /* bars (instanced) */
  const barCount = Math.floor(segmentLength / 0.14);
  for(let index = 0; index < barCount; index++){
    const alongDistance = 0.07 + index * 0.14;
    barMatrix.makeTranslation(
      planToWorldX(segment.fromX + directionX * alongDistance),
      0.72,
      planToWorldZ(segment.fromZ + directionZ * alongDistance)
    );
    if(barIndex < totalBarCount){ fenceBars.setMatrixAt(barIndex, barMatrix); barIndex++; }
  }
}
fenceBars.count = barIndex;
parkGroup.add(fenceBars);

/* gate panels, slightly open */
for(const gate of [{hingeX: 27.6, swing: 1.0}, {hingeX: 30.2, swing: -1.0}]){
  const gatePivot = new THREE.Group();
  gatePivot.position.set(planToWorldX(gate.hingeX), 0, planToWorldZ(0));
  const gatePanel = new THREE.Mesh(new THREE.BoxGeometry(1.25, 1.35, 0.05), fenceMaterial);
  gatePanel.position.set(gate.swing * 0.625, 0.75, 0);
  gatePivot.add(gatePanel);
  gatePivot.rotation.y = gate.swing * 1.15;
  parkGroup.add(gatePivot);
}

/* ---------- wall-mounted running pipes, north edge (22.6 m long per plan) ---------- */
const pipeWallGroup = new THREE.Group();
for(let postIndex = 0; postIndex <= 10; postIndex++){
  const post = new THREE.Mesh(new THREE.BoxGeometry(0.12, 1.3, 0.12), woodDarkMaterial);
  post.position.set(-11.3 + postIndex * 2.26, 0.65, 0);
  post.castShadow = true;
  pipeWallGroup.add(post);
}
const pipeBoard = new THREE.Mesh(new THREE.BoxGeometry(22.6, 0.55, 0.07), woodMaterial);
pipeBoard.position.set(0, 1.0, 0);
pipeBoard.castShadow = true;
pipeWallGroup.add(pipeBoard);
for(const pipeY of [0.42, 0.72]){
  const runningPipe = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 22.6, 10), pipeMaterial);
  runningPipe.rotation.z = Math.PI / 2;
  runningPipe.position.set(0, pipeY, 0.18);
  runningPipe.castShadow = true;
  pipeWallGroup.add(runningPipe);
}
placeInPark(pipeWallGroup, 16.1, 29.2, 0);

/* ---------- block benches along west edge (High Line style) ---------- */
const benchCenters = [7.2, 15.25, 23.3];
for(const benchCenterZ of benchCenters){
  const bench = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.45, 8.2), woodMaterial);
  bench.castShadow = true;
  bench.receiveShadow = true;
  placeInPark(bench, 2.85, benchCenterZ, 0.225);
}

/* ---------- folly structure: solid timber volume with cut openings (9.1 x 11 m zone per plan) ---------- */
function createPlankTexture(){
  const textureCanvas = document.createElement("canvas");
  textureCanvas.width = 256; textureCanvas.height = 64;
  const context = textureCanvas.getContext("2d");
  const plankTones = ["#b08a55", "#a98052", "#b4905d", "#a3794c", "#ad8656"];
  let drawX = 0, toneIndex = 0;
  while(drawX < 256){
    const plankWidth = 10 + Math.random() * 8;
    context.fillStyle = plankTones[toneIndex % plankTones.length];
    context.fillRect(drawX, 0, plankWidth, 64);
    context.fillStyle = "rgba(60,40,20,0.35)";
    context.fillRect(drawX, 0, 1.5, 64);
    drawX += plankWidth;
    toneIndex++;
  }
  const texture = new THREE.CanvasTexture(textureCanvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}
const follyWoodMaterial = new THREE.MeshStandardMaterial({ map: createPlankTexture(), roughness: 0.85 });

const FOLLY_WALL_HEIGHT = 3.6;
const FOLLY_WALL_THICKNESS = 0.26;
/* builds a wall along local x, base at y 0, with rectangular openings cut out of it */
function buildFollyWall(wallLength, openings){
  const wallGroup = new THREE.Group();
  function addPanel(fromX, toX, fromY, toY){
    const panelWidth = toX - fromX;
    const panelHeight = toY - fromY;
    if(panelWidth <= 0.01 || panelHeight <= 0.01) return;
    const panel = new THREE.Mesh(
      new THREE.BoxGeometry(panelWidth, panelHeight, FOLLY_WALL_THICKNESS), follyWoodMaterial
    );
    panel.position.set(fromX + panelWidth / 2, fromY + panelHeight / 2, 0);
    panel.castShadow = true;
    panel.receiveShadow = true;
    wallGroup.add(panel);
  }
  const sortedOpenings = [...openings].sort((first, second) => first.center - second.center);
  let cursor = -wallLength / 2;
  for(const opening of sortedOpenings){
    const openingStart = opening.center - opening.width / 2;
    const openingEnd = opening.center + opening.width / 2;
    addPanel(cursor, openingStart, 0, FOLLY_WALL_HEIGHT);
    addPanel(openingStart, openingEnd, 0, opening.sill);
    addPanel(openingStart, openingEnd, opening.sill + opening.height, FOLLY_WALL_HEIGHT);
    cursor = openingEnd;
  }
  addPanel(cursor, wallLength / 2, 0, FOLLY_WALL_HEIGHT);
  return wallGroup;
}
const follyGroup = new THREE.Group();
/* south wall (faces the entrance): centered doorway + two square windows */
const follySouthWall = buildFollyWall(7, [
  { center: 0, width: 2.6, sill: 0, height: 2.3 },
  { center: -2.55, width: 1.3, sill: 1.0, height: 1.3 },
  { center: 2.55, width: 1.3, sill: 1.0, height: 1.3 }
]);
follySouthWall.position.z = 4.25;
follyGroup.add(follySouthWall);
/* north wall: wide picture window + dog-sized door */
const follyNorthWall = buildFollyWall(7, [
  { center: 0, width: 3.0, sill: 0.6, height: 1.9 },
  { center: 2.3, width: 0.75, sill: 0, height: 0.8 }
]);
follyNorthWall.position.z = -4.25;
follyGroup.add(follyNorthWall);
/* east wall: centered doorway + square window */
const follyEastWall = buildFollyWall(8.5, [
  { center: 0, width: 2.2, sill: 0, height: 2.3 },
  { center: 2.7, width: 1.3, sill: 0.9, height: 1.3 }
]);
follyEastWall.rotation.y = Math.PI / 2;
follyEastWall.position.x = 3.5;
follyGroup.add(follyEastWall);

function createMound(lengthScale, heightScale, widthScale, rotationY, tunnelEnds, tunnelRadius){
  const moundGroup = new THREE.Group();
  const dome = new THREE.Mesh(new THREE.SphereGeometry(1, 22, 14), moundMaterial);
  dome.scale.set(lengthScale, heightScale, widthScale);
  dome.castShadow = true;
  dome.receiveShadow = true;
  moundGroup.add(dome);
  for(const endSign of tunnelEnds){
    const tunnel = new THREE.Mesh(new THREE.CylinderGeometry(tunnelRadius, tunnelRadius, 1.3, 14), holeMaterial);
    tunnel.rotation.z = Math.PI / 2;
    tunnel.position.set(endSign * lengthScale * 0.74, 0.42, 0);
    moundGroup.add(tunnel);
  }
  moundGroup.rotation.y = rotationY;
  return moundGroup;
}

/* ---------- Roosevelt Island Tramway cable + cabin ---------- */
function createCableBetween(pointA, pointB, radius){
  const length = pointA.distanceTo(pointB);
  const cable = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, length, 6), cableMaterial);
  cable.position.copy(pointA).add(pointB).multiplyScalar(0.5);
  const direction = new THREE.Vector3().subVectors(pointB, pointA).normalize();
  cable.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
  return cable;
}

  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.16, 0.34, 4, 8), furMaterial);
  body.rotation.z = Math.PI / 2;
  body.position.y = 0.34;
  body.castShadow = true;

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.13, 8, 7), furMaterial);
  head.position.set(0.3, 0.47, 0);
  head.castShadow = true;
  dogGroup.add(head);
  const snout = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.09, 0.1), furMaterial);
  snout.position.set(0.41, 0.43, 0);
  dogGroup.add(snout);
  for(const earSide of [-1, 1]){
    const ear = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.12, 5), furMaterial);
    ear.position.set(0.28, 0.59, earSide * 0.07);
    dogGroup.add(ear);
  }
  for(const [legX, legZ] of [[0.15, 0.09], [0.15, -0.09], [-0.15, 0.09], [-0.15, -0.09]]){
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.032, 0.3, 6), furMaterial);

    dogGroup.add(leg);

  tail.position.set(-0.33, 0.47, 0);
  tail.rotation.z = 0.9;
  dogGroup.add(tail);
  dogGroup.scale.setScalar(scaleFactor);
  return dogGroup;
}

const DAY_SKY = new THREE.Color("#aecfe8");
const DAY_FOG = new THREE.Color("#c3d9ec");
const NIGHT_SKY = new THREE.Color("#0b1322");
const NIGHT_FOG = new THREE.Color("#0d1626");

let nightMode = false;
function setNightMode(enabled){
  nightMode = enabled;
  scene.background.copy(enabled ? NIGHT_SKY : DAY_SKY);
  scene.fog.color.copy(enabled ? NIGHT_FOG : DAY_FOG);
  scene.fog.near = enabled ? 45 : 70;
  scene.fog.far = enabled ? 170 : 220;
  sunLight.visible = !enabled;
  moonLight.visible = enabled;
  hemisphereLight.color.set(enabled ? "#2a3550" : "#cfe8ff");
  hemisphereLight.groundColor.set(enabled ? "#0c0f16" : "#8a7a5c");
  hemisphereLight.intensity = enabled ? 0.4 : 0.85;
  for(const pointLight of nightPointLights){ pointLight.visible = enabled; }
  stringLights.visible = enabled;
  stringLightMaterial.emissiveIntensity = enabled ? 2.2 : 0;
  bollardCapMaterial.emissiveIntensity = enabled ? 1.6 : 0;
  lampFixtureMaterial.emissiveIntensity = enabled ? 1.8 : 0;
  for(const material of buildingWindowMaterials){ material.emissiveIntensity = enabled ? 0.9 : 0; }
  renderer.toneMappingExposure = enabled ? 0.95 : 1.05;
  nightButton.textContent = enabled ? "Day" : "Night";
  nightButton.classList.toggle("active", enabled);
}

];
const labelLayer = document.getElementById("labelLayer");
const labelEntries = labelDefinitions.map(([text, labelPlanX, labelPlanZ, labelY]) => {
  const element = document.createElement("div");
  element.className = "siteLabel";
  element.textContent = text;
  labelLayer.appendChild(element);
  return {
    element,
    worldPosition: new THREE.Vector3(planToWorldX(labelPlanX), labelY + PARK_GROUND_HEIGHT, planToWorldZ(labelPlanZ))
  };
});
let labelsVisible = true;
const labelProjection = new THREE.Vector3();
function updateLabels(){
  for(const entry of labelEntries){
    if(!labelsVisible){ entry.element.style.display = "none"; continue; }
    labelProjection.copy(entry.worldPosition).project(camera);
    const inFront = labelProjection.z < 1;
    const distance = camera.position.distanceTo(entry.worldPosition);
    const maxDistance = viewMode === "orbit" ? 120 : 42;
    if(!inFront || distance > maxDistance){
      entry.element.style.display = "none";
      continue;
    }
    entry.element.style.display = "block";
    entry.element.style.left = ((labelProjection.x + 1) / 2 * window.innerWidth) + "px";
    entry.element.style.top = ((-labelProjection.y + 1) / 2 * window.innerHeight) + "px";
    entry.element.style.opacity = viewMode === "orbit" ? 1 : Math.max(0.25, Math.min(1, (maxDistance - distance) / 24));
  }
}

  { minX: 1.8, maxX: 3.9, minZ: 19.1, maxZ: 27.5 },
  /* folly walls, doorways left open (south door x 12.75-15.25, east door z 16.35-18.65) */
  { minX: 10.4, maxX: 12.75, minZ: 13.05, maxZ: 13.45 },
  { minX: 15.25, maxX: 17.6, minZ: 13.05, maxZ: 13.45 },
  { minX: 10.4, maxX: 17.6, minZ: 21.55, maxZ: 21.95 },
  { minX: 17.3, maxX: 17.7, minZ: 13.05, maxZ: 16.35 },
  { minX: 17.3, maxX: 17.7, minZ: 18.65, maxZ: 21.95 },
  { minX: 10.3, maxX: 10.7, minZ: 13.05, maxZ: 21.95 }
];
function resolveCollisions(position){
  for(const collider of circleColliders){
    const deltaX = position.planX - collider.planX;
    const deltaZ = position.planZ - collider.planZ;
    const distance = Math.hypot(deltaX, deltaZ);
    if(distance < collider.radius && distance > 0.0001){
      const scale = collider.radius / distance;
      position.planX = collider.planX + deltaX * scale;
      position.planZ = collider.planZ + deltaZ * scale;
    }
  }
  for(const collider of boxColliders){
    if(position.planX > collider.minX && position.planX < collider.maxX &&
       position.planZ > collider.minZ && position.planZ < collider.maxZ){
      const pushWest = position.planX - collider.minX;
      const pushEast = collider.maxX - position.planX;
      const pushSouth = position.planZ - collider.minZ;
      const pushNorth = collider.maxZ - position.planZ;
      const smallestPush = Math.min(pushWest, pushEast, pushSouth, pushNorth);
      if(smallestPush === pushWest){ position.planX = collider.minX; }
      else if(smallestPush === pushEast){ position.planX = collider.maxX; }
      else if(smallestPush === pushSouth){ position.planZ = collider.minZ; }
      else { position.planZ = collider.maxZ; }
    }
  }
  position.planX = Math.min(31.4, Math.max(0.9, position.planX));
  position.planZ = Math.min(29.6, Math.max(0.9, position.planZ));
}

/* ---------- walkable surfaces: the player stands on, steps up and jumps onto these ---------- */
const MAX_STEP_HEIGHT = 0.55;
let playerFeetY = 0;
let verticalVelocity = 0;
let isGrounded = true;

const rectangleSurfaces = [
  /* west block benches (walkable tops) */
  { minX: 1.9, maxX: 3.8, minZ: 3.1, maxZ: 11.3, height: 0.45 },
  { minX: 1.9, maxX: 3.8, minZ: 11.15, maxZ: 19.35, height: 0.45 },
  { minX: 1.9, maxX: 3.8, minZ: 19.2, maxZ: 27.4, height: 0.45 },
  /* folly deck, interior bench, and solid walls (too tall to step or jump onto) */
  { minX: 10.55, maxX: 17.45, minZ: 13.3, maxZ: 21.7, height: 0.12 },
  { minX: 10.85, maxX: 11.35, minZ: 16.1, maxZ: 18.9, height: 0.54 },
  { minX: 10.4, maxX: 12.75, minZ: 13.05, maxZ: 13.45, height: 3.6 },
  { minX: 15.25, maxX: 17.6, minZ: 13.05, maxZ: 13.45, height: 3.6 },
  { minX: 10.4, maxX: 17.6, minZ: 21.55, maxZ: 21.95, height: 3.6 },
  { minX: 17.3, maxX: 17.7, minZ: 13.05, maxZ: 16.35, height: 3.6 },
  { minX: 17.3, maxX: 17.7, minZ: 18.65, maxZ: 21.95, height: 3.6 },
  { minX: 10.3, maxX: 10.7, minZ: 13.05, maxZ: 21.95, height: 3.6 },
  /* slide platform deck */
  { minX: 23.45, maxX: 25.55, minZ: 14.95, maxZ: 17.05, height: 1.68 },
  /* running-pipe wall and vestibule fence returns (block movement) */
  { minX: 4.8, maxX: 27.4, minZ: 28.95, maxZ: 29.45, height: 1.3 },
  { minX: 27.5, maxX: 27.7, minZ: 0, maxZ: 4.3, height: 1.5 },
  { minX: 30.1, maxX: 30.3, minZ: 0, maxZ: 4.3, height: 1.5 }
];
const moundSurfaces = [
  { planX: 16.8, planZ: 8.0,  rotationY: 0.10, alongAxis: 3.8, upAxis: 1.7, crossAxis: 2.2 },
  { planX: 20.5, planZ: 22.5, rotationY: 0.50, alongAxis: 4.3, upAxis: 1.9, crossAxis: 2.4 },
  { planX: 11.5, planZ: 23.8, rotationY: -0.35, alongAxis: 3.0, upAxis: 1.4, crossAxis: 1.9 }
];
function moundHeightAt(mound, planX, planZ){
  const worldDeltaX = planX - mound.planX;
  const worldDeltaZ = -(planZ - mound.planZ);
  const cosRotation = Math.cos(mound.rotationY), sinRotation = Math.sin(mound.rotationY);
  const localX = cosRotation * worldDeltaX - sinRotation * worldDeltaZ;
  const localZ = sinRotation * worldDeltaX + cosRotation * worldDeltaZ;
  const normalizedRadius = (localX / mound.alongAxis) ** 2 + (localZ / mound.crossAxis) ** 2;
  if(normalizedRadius >= 1) return 0;
  return mound.upAxis * Math.sqrt(1 - normalizedRadius);
}
function rampHeightAt(planX, planZ){
  let height = 0;
  /* slide stairs (east side) as a walkable ramp */
  if(planZ > 15.45 && planZ < 16.55 && planX > 25.5 && planX < 27.3){
    height = Math.max(height, Math.min(1.5, ((27.3 - planX) / 1.8) * 1.55));
  }
  /* slide chute (west side) as a walkable ramp */
  if(planZ > 15.55 && planZ < 16.45 && planX > 20.5 && planX < 24.5){
    height = Math.max(height, 0.15 + ((planX - 20.5) / 4.0) * 1.5);
  }
  return height;
}
function surfaceHeightAt(planX, planZ){
  let height = 0;
  for(const surface of rectangleSurfaces){
    if(planX >= surface.minX && planX <= surface.maxX && planZ >= surface.minZ && planZ <= surface.maxZ){
      height = Math.max(height, surface.height);
    }
  }
  for(const mound of moundSurfaces){
    height = Math.max(height, moundHeightAt(mound, planX, planZ));
  }
  height = Math.max(height, rampHeightAt(planX, planZ));
  return height;
}
const staticBlockerCircles = [
  { planX: 3.2, planZ: 27.6, radius: 0.6 },
  { planX: 3.2, planZ: 2.8, radius: 0.6 },
  { planX: 26.2, planZ: 3.0, radius: 0.6 },
  { planX: 7.6, planZ: 24.6, radius: 0.55 }
];
function pushPlayerOutOfCircles(){
  if(playerFeetY > 0.9) return; /* standing on a structure above them */
  const blockerCircles = staticBlockerCircles.concat(
    wanderingDogs.map(dog => ({ planX: dog.planX, planZ: dog.planZ, radius: 0.65 }))
  );
  for(const blocker of blockerCircles){
    const deltaX = playerPosition.planX - blocker.planX;
    const deltaZ = playerPosition.planZ - blocker.planZ;
    const distance = Math.hypot(deltaX, deltaZ);
    if(distance < blocker.radius && distance > 0.0001){
      const scale = blocker.radius / distance;
      playerPosition.planX = blocker.planX + deltaX * scale;
      playerPosition.planZ = blocker.planZ + deltaZ * scale;
    }
  }
}
function playerJump(){
  if(viewMode !== "orbit" && isGrounded){
    verticalVelocity = 6.8;
    isGrounded = false;
  }
}

/* ---------- player state + controls ---------- */
let viewMode = "walk"; // walk | dog | orbit
const playerPosition = { planX: 28.9, planZ: 3.2 };
let playerYaw = Math.atan2(-(planToWorldX(14) - planToWorldX(28.9)), -(planToWorldZ(17.5) - planToWorldZ(3.2)));
let playerPitch = -0.03;
let eyeHeight = 1.7;

const orbitState = { theta: 0.7, phi: 0.95, radius: 44 };
const movementKeys = { forward: false, back: false, left: false, right: false, run: false };
const joystickVector = { x: 0, y: 0 };

document.addEventListener("keydown", (event) => {
  if(event.code === "Space" || event.code === "ArrowUp" || event.code === "ArrowDown" || event.code === "ArrowLeft" || event.code === "ArrowRight"){
    event.preventDefault();
  }
  switch(event.code){
    case "Space": playerJump(); break;
    case "KeyW": case "ArrowUp": movementKeys.forward = true; break;
    case "KeyS": case "ArrowDown": movementKeys.back = true; break;
    case "KeyA": case "ArrowLeft": movementKeys.left = true; break;
    case "KeyD": case "ArrowRight": movementKeys.right = true; break;
    case "ShiftLeft": case "ShiftRight": movementKeys.run = true; break;
    case "KeyN": setNightMode(!nightMode); break;
  }
  dismissHint();
});
document.addEventListener("keyup", (event) => {
  switch(event.code){
    case "KeyW": case "ArrowUp": movementKeys.forward = false; break;
    case "KeyS": case "ArrowDown": movementKeys.back = false; break;
    case "KeyA": case "ArrowLeft": movementKeys.left = false; break;
    case "KeyD": case "ArrowRight": movementKeys.right = false; break;
    case "ShiftLeft": case "ShiftRight": movementKeys.run = false; break;
  }
});

let pointerLocked = false;
canvas.addEventListener("click", () => {
  if(viewMode !== "orbit" && !pointerLocked && canvas.requestPointerLock){
    try{ canvas.requestPointerLock(); }catch(lockError){ /* drag fallback below */ }
  }
});
document.addEventListener("pointerlockchange", () => {
  pointerLocked = document.pointerLockElement === canvas;
});

let dragging = false;
let lastPointerX = 0, lastPointerY = 0;
canvas.addEventListener("mousedown", (event) => {
  dragging = true;
  lastPointerX = event.clientX;
  lastPointerY = event.clientY;
  dismissHint();
});
window.addEventListener("mouseup", () => { dragging = false; });
window.addEventListener("mousemove", (event) => {
  if(pointerLocked && viewMode !== "orbit"){
    playerYaw += event.movementX * 0.0023;
    playerPitch = Math.min(1.35, Math.max(-1.35, playerPitch - event.movementY * 0.0023));
    return;
  }
  if(!dragging) return;
  const deltaX = event.clientX - lastPointerX;
  const deltaY = event.clientY - lastPointerY;
  lastPointerX = event.clientX;
  lastPointerY = event.clientY;
  if(viewMode === "orbit"){
    orbitState.theta -= deltaX * 0.005;
    orbitState.phi = Math.min(1.35, Math.max(0.25, orbitState.phi - deltaY * 0.004));
  }else{
    playerYaw += deltaX * 0.004;
    playerPitch = Math.min(1.35, Math.max(-1.35, playerPitch - deltaY * 0.004));
  }
});
canvas.addEventListener("wheel", (event) => {
  if(viewMode === "orbit"){
    event.preventDefault();
    orbitState.radius = Math.min(85, Math.max(16, orbitState.radius * (1 + event.deltaY * 0.001)));
  }
}, { passive: false });

/* touch: joystick moves, canvas drag looks, pinch zooms in orbit */
const joystickBase = document.getElementById("joystickBase");
const joystickNub = document.getElementById("joystickNub");
let joystickTouchId = null;
let lookTouchId = null;
let lastLookX = 0, lastLookY = 0;
let pinchDistance = 0;

joystickBase.addEventListener("touchstart", (event) => {
  event.preventDefault();
  const touch = event.changedTouches[0];
  joystickTouchId = touch.identifier;
  dismissHint();
}, { passive: false });
joystickBase.addEventListener("touchmove", (event) => {
  event.preventDefault();
  for(const touch of event.changedTouches){
    if(touch.identifier !== joystickTouchId) continue;
    const rect = joystickBase.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    let offsetX = touch.clientX - centerX;
    let offsetY = touch.clientY - centerY;
    const magnitude = Math.hypot(offsetX, offsetY);
    const limit = rect.width / 2 - 8;
    if(magnitude > limit){ offsetX *= limit / magnitude; offsetY *= limit / magnitude; }
    joystickNub.style.transform = `translate(calc(-50% + ${offsetX}px), calc(-50% + ${offsetY}px))`;
    joystickVector.x = offsetX / limit;
    joystickVector.y = -offsetY / limit;
  }
}, { passive: false });
function endJoystickTouch(event){
  for(const touch of event.changedTouches){
    if(touch.identifier === joystickTouchId){
      joystickTouchId = null;
      joystickVector.x = 0; joystickVector.y = 0;
      joystickNub.style.transform = "translate(-50%,-50%)";
    }
  }
}
joystickBase.addEventListener("touchend", endJoystickTouch);
joystickBase.addEventListener("touchcancel", endJoystickTouch);

canvas.addEventListener("touchstart", (event) => {
  event.preventDefault();
  dismissHint();
  if(viewMode === "orbit" && event.touches.length === 2){
    pinchDistance = Math.hypot(
      event.touches[0].clientX - event.touches[1].clientX,
      event.touches[0].clientY - event.touches[1].clientY
    );
    return;
  }
  const touch = event.changedTouches[0];
  lookTouchId = touch.identifier;
  lastLookX = touch.clientX;
  lastLookY = touch.clientY;
}, { passive: false });
canvas.addEventListener("touchmove", (event) => {
  event.preventDefault();
  if(viewMode === "orbit" && event.touches.length === 2){
    const newDistance = Math.hypot(
      event.touches[0].clientX - event.touches[1].clientX,
      event.touches[0].clientY - event.touches[1].clientY
    );
    if(pinchDistance > 0){
      orbitState.radius = Math.min(85, Math.max(16, orbitState.radius * (pinchDistance / newDistance)));
    }
    pinchDistance = newDistance;
    return;
  }
  for(const touch of event.changedTouches){
    if(touch.identifier !== lookTouchId) continue;
    const deltaX = touch.clientX - lastLookX;
    const deltaY = touch.clientY - lastLookY;
    lastLookX = touch.clientX;
    lastLookY = touch.clientY;
    if(viewMode === "orbit"){
      orbitState.theta -= deltaX * 0.006;
      orbitState.phi = Math.min(1.35, Math.max(0.25, orbitState.phi - deltaY * 0.005));
    }else{
      playerYaw += deltaX * 0.005;
      playerPitch = Math.min(1.35, Math.max(-1.35, playerPitch - deltaY * 0.005));
    }
  }
}, { passive: false });
canvas.addEventListener("touchend", (event) => {
  for(const touch of event.changedTouches){
    if(touch.identifier === lookTouchId){ lookTouchId = null; }
  }
  if(event.touches.length < 2){ pinchDistance = 0; }
});

/* ---------- mode + UI buttons ---------- */
const walkButton = document.getElementById("walkButton");
const dogButton = document.getElementById("dogButton");
const orbitButton = document.getElementById("orbitButton");
const nightButton = document.getElementById("nightButton");
const labelsButton = document.getElementById("labelsButton");
const jumpButton = document.getElementById("jumpButton");
jumpButton.addEventListener("touchstart", (event) => {
  event.preventDefault();
  playerJump();
  dismissHint();
}, { passive: false });
jumpButton.addEventListener("click", () => { playerJump(); });

function setViewMode(mode){
  viewMode = mode;
  walkButton.classList.toggle("active", mode === "walk");
  dogButton.classList.toggle("active", mode === "dog");
  orbitButton.classList.toggle("active", mode === "orbit");
  eyeHeight = mode === "dog" ? 0.55 : 1.7;
  camera.fov = mode === "dog" ? 82 : 72;
  camera.updateProjectionMatrix();
  joystickBase.hidden = !(isTouchDevice && mode !== "orbit");
  jumpButton.hidden = !(isTouchDevice && mode !== "orbit");
  if(mode === "orbit" && document.pointerLockElement === canvas && document.exitPointerLock){
    document.exitPointerLock();
  }
  updateHintText();
}
walkButton.addEventListener("click", () => setViewMode("walk"));
dogButton.addEventListener("click", () => setViewMode("dog"));
orbitButton.addEventListener("click", () => setViewMode("orbit"));
nightButton.addEventListener("click", () => setNightMode(!nightMode));
labelsButton.addEventListener("click", () => {
  labelsVisible = !labelsVisible;
  labelsButton.classList.toggle("active", labelsVisible);
});

/* ---------- hint ---------- */
const hintOverlay = document.getElementById("hintOverlay");
let hintDismissed = false;
function updateHintText(){
  if(hintDismissed) return;
  if(viewMode === "orbit"){
    hintOverlay.textContent = isTouchDevice ? "Drag to orbit · pinch to zoom" : "Drag to orbit · scroll to zoom";
  }else{
    hintOverlay.textContent = isTouchDevice
      ? "Left pad to walk · drag to look · Jump button to hop"
      : "Click the scene, then WASD / arrows to walk · mouse to look · Space to jump · Shift to run · N for night";
  }
  hintOverlay.hidden = false;
}
function dismissHint(){
  if(hintDismissed) return;
  hintDismissed = true;
  hintOverlay.style.opacity = "0";
  setTimeout(() => { hintOverlay.hidden = true; }, 700);
}
updateHintText();
setTimeout(dismissHint, 12000);

/* ---------- animation loop ---------- */
const clock = new THREE.Clock();
let sceneHasRendered = false;

function updatePlayer(deltaSeconds){
  const forwardInput = (movementKeys.forward ? 1 : 0) - (movementKeys.back ? 1 : 0) + joystickVector.y;
  const strafeInput = (movementKeys.right ? 1 : 0) - (movementKeys.left ? 1 : 0) + joystickVector.x;
  const inputMagnitude = Math.hypot(forwardInput, strafeInput);
  if(inputMagnitude > 0.01){
    const normalizedForward = forwardInput / Math.max(1, inputMagnitude);
    const normalizedStrafe = strafeInput / Math.max(1, inputMagnitude);
    const baseSpeed = viewMode === "dog" ? 3.4 : (movementKeys.run ? 5.2 : 2.7);
    const forwardX = -Math.sin(playerYaw), forwardZ = -Math.cos(playerYaw);
    const rightX = Math.cos(playerYaw), rightZ = -Math.sin(playerYaw);
    const movePlanX = (forwardX * normalizedForward + rightX * normalizedStrafe) * baseSpeed * deltaSeconds;
    const movePlanZ = -(forwardZ * normalizedForward + rightZ * normalizedStrafe) * baseSpeed * deltaSeconds;
    /* move one axis at a time so walls let you slide along them; a surface more than
       MAX_STEP_HEIGHT above the feet blocks the move, lower ones are stepped onto */
    const candidateX = Math.min(31.4, Math.max(0.9, playerPosition.planX + movePlanX));
    if(surfaceHeightAt(candidateX, playerPosition.planZ) <= playerFeetY + MAX_STEP_HEIGHT){
      playerPosition.planX = candidateX;
    }
    const candidateZ = Math.min(29.6, Math.max(0.9, playerPosition.planZ + movePlanZ));
    if(surfaceHeightAt(playerPosition.planX, candidateZ) <= playerFeetY + MAX_STEP_HEIGHT){
      playerPosition.planZ = candidateZ;
    }
  }
  pushPlayerOutOfCircles();
  /* gravity and landing */
  verticalVelocity -= 22 * deltaSeconds;
  playerFeetY += verticalVelocity * deltaSeconds;
  const floorHeight = surfaceHeightAt(playerPosition.planX, playerPosition.planZ);
  if(playerFeetY <= floorHeight){
    playerFeetY = floorHeight;
    verticalVelocity = 0;
    isGrounded = true;
  }else{
    isGrounded = false;
  }
  camera.position.set(
    planToWorldX(playerPosition.planX),
    PARK_GROUND_HEIGHT + playerFeetY + eyeHeight,
    planToWorldZ(playerPosition.planZ)
  );
  camera.rotation.set(playerPitch, playerYaw, 0);
}

function updateOrbit(deltaSeconds){
  if(!prefersReducedMotion && lookTouchId === null && !dragging){
    orbitState.theta += deltaSeconds * 0.06;
  }
  const targetPoint = new THREE.Vector3(0, 1.2, 0);
  camera.position.set(
    targetPoint.x + orbitState.radius * Math.sin(orbitState.phi) * Math.sin(orbitState.theta),
    targetPoint.y + orbitState.radius * Math.cos(orbitState.phi),
    targetPoint.z + orbitState.radius * Math.sin(orbitState.phi) * Math.cos(orbitState.theta)
  );
  camera.lookAt(targetPoint);
}

function updateDogs(deltaSeconds){
  for(const dog of wanderingDogs){
    if(dog.pauseTimer > 0){
      dog.pauseTimer -= deltaSeconds;
    }else{
      dog.retargetTimer -= deltaSeconds;
      const deltaX = dog.targetX - dog.planX;
      const deltaZ = dog.targetZ - dog.planZ;
      const distance = Math.hypot(deltaX, deltaZ);
      if(distance < 0.5 || dog.retargetTimer <= 0){
        dog.retargetTimer = 10;
        if(Math.random() < 0.45){ dog.pauseTimer = 1 + Math.random() * 2.5; }
        dog.targetX = 5 + Math.random() * 23;
        dog.targetZ = 5 + Math.random() * 21;
      }else{
        dog.planX += (deltaX / distance) * dog.speed * deltaSeconds;
        dog.planZ += (deltaZ / distance) * dog.speed * deltaSeconds;
        resolveCollisions(dog);
        const desiredYaw = Math.atan2(deltaZ, deltaX); // plan coords; worldZ flip handled below
        dog.yaw += (desiredYaw - dog.yaw) * Math.min(1, deltaSeconds * 5);
      }
    }
    dog.group.position.set(planToWorldX(dog.planX), 0, planToWorldZ(dog.planZ));
    dog.group.rotation.y = dog.yaw; // facing +x at yaw 0; plan +z = world -z, matching rotation sense
  }
}

let tramPhase = 0;
function updateTram(deltaSeconds){
  if(!prefersReducedMotion){ tramPhase += deltaSeconds * 0.045; }
  const travel = 0.5 + 0.44 * Math.sin(tramPhase);
  tramCabin.position.lerpVectors(cableStart, cableEnd, travel);
  tramCabin.position.y -= 2.1;
}

function animate(){
  const deltaSeconds = Math.min(0.05, clock.getDelta());
  if(viewMode === "orbit"){ updateOrbit(deltaSeconds); } else { updatePlayer(deltaSeconds); }
  updateDogs(deltaSeconds);
  updateTram(deltaSeconds);
  updateLabels();
  renderer.render(scene, camera);
  if(!sceneHasRendered){ sceneHasRendered = true; window.__sceneReady = true; }
  requestAnimationFrame(animate);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

setViewMode("walk");
setNightMode(false);

setTimeout(() => {
  if(!window.__sceneReady){ document.getElementById("errorNote").hidden = false; }
}, 6000);
</script>
